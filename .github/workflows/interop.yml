name: Interop

# Cross-library round trips (tests/interop): labels generated by @wemush/wols
# must decrypt with this library, and labels generated here must decrypt with
# @wemush/wols. Runs against the published @wemush/wols release and against
# its main branch, so a regression on either side fails the build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WOLS_JS_PUBLISHED_VERSION: '1.4.0'

jobs:
  interop:
    name: Round trip with @wemush/wols (${{ matrix.js }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        js: ['published', 'main']

    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Checkout specimen-labels-js (main)
        if: matrix.js == 'main'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          repository: wemush/specimen-labels-js
          ref: main
          path: specimen-labels-js

      - name: Setup Bun
        if: matrix.js == 'main'
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: latest

      - name: Install @wemush/wols
        run: |
          JS_ENV="$RUNNER_TEMP/wols-js"
          mkdir -p "$JS_ENV"
          cd "$JS_ENV"
          npm init -y > /dev/null
          if [ "${{ matrix.js }}" = "published" ]; then
            npm install "@wemush/wols@${WOLS_JS_PUBLISHED_VERSION}"
          else
            (cd "$GITHUB_WORKSPACE/specimen-labels-js" && bun install --frozen-lockfile && bun run build && npm pack --pack-destination "$RUNNER_TEMP")
            npm install "$RUNNER_TEMP"/wemush-wols-*.tgz
          fi
          cp "$GITHUB_WORKSPACE/tests/interop/harness.mjs" "$JS_ENV/"
          echo "JS_HARNESS=$JS_ENV/harness.mjs" >> "$GITHUB_ENV"

      - name: Compare tests/interop with specimen-labels-js
        if: matrix.js == 'main'
        run: |
          for f in matrix.json harness.py harness.mjs README.md corpus/python-1.3.0.json corpus/typescript-1.3.0.json; do
            other="specimen-labels-js/tests/interop/$f"
            if [ ! -f "$other" ]; then
              echo "::notice::specimen-labels-js main has no tests/interop/$f yet"
            elif ! cmp -s "tests/interop/$f" "$other"; then
              echo "::warning file=tests/interop/$f::tests/interop/$f differs from specimen-labels-js main; keep the copies identical"
            fi
          done

      - name: TypeScript generates, Python decrypts
        run: |
          node "$JS_HARNESS" generate tests/interop/matrix.json "$RUNNER_TEMP/corpus-typescript.json"
          uv run python tests/interop/harness.py verify tests/interop/matrix.json "$RUNNER_TEMP/corpus-typescript.json"

      - name: Python generates, TypeScript decrypts
        if: success() || failure()
        run: |
          uv run python tests/interop/harness.py generate tests/interop/matrix.json "$RUNNER_TEMP/corpus-python.json"
          node "$JS_HARNESS" verify tests/interop/matrix.json "$RUNNER_TEMP/corpus-python.json"

      - name: Upload corpora
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: interop-corpora-${{ matrix.js }}
          path: ${{ runner.temp }}/corpus-*.json
          if-no-files-found: ignore
