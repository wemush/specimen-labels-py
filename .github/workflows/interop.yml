name: Interop

# Cross-library round trip: this library and the TypeScript @wemush/wols
# library each encrypt interop/matrix.json, and each decrypts the other's
# labels. Runs against the published npm package and against its main branch,
# so a regression on either side fails the build. The nightly run catches
# changes that land on the TypeScript side between pull requests here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roundtrip:
    name: Round trip with @wemush/wols ${{ matrix.js-wols.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        js-wols:
          - name: '1.3.0 (npm)'
            slug: npm-1.3.0
            source: npm
          - name: main
            slug: main
            source: git
    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true

      - name: Install this library
        run: |
          uv python install 3.12
          uv sync --extra crypto

      - name: Setup Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22'

      - name: Install @wemush/wols 1.3.0 from npm
        if: matrix.js-wols.source == 'npm'
        run: |
          npm install --prefix "$RUNNER_TEMP/js" --no-audit --no-fund @wemush/wols@1.3.0
          echo "WOLS_JS=$RUNNER_TEMP/js/node_modules/@wemush/wols" >> "$GITHUB_ENV"

      # main has no `prepare` script and dist/ is not committed, so build it.
      - name: Setup Bun
        if: matrix.js-wols.source == 'git'
        uses: oven-sh/setup-bun@b7a1c7ccf290d58743029c4f6903da283811b979 # v2.1.0
        with:
          bun-version: latest

      - name: Build @wemush/wols from main
        if: matrix.js-wols.source == 'git'
        run: |
          git clone --depth 1 --branch main https://github.com/wemush/specimen-labels-js "$RUNNER_TEMP/js"
          git -C "$RUNNER_TEMP/js" log -1 --format='specimen-labels-js main at %H'
          cd "$RUNNER_TEMP/js"
          bun install --frozen-lockfile
          bun run build
          echo "WOLS_JS=$RUNNER_TEMP/js" >> "$GITHUB_ENV"

      - name: Round trip (Python -> TS, TS -> Python)
        run: interop/roundtrip.sh "$WOLS_JS" "$PWD/.venv/bin/python" "$RUNNER_TEMP/corpora"

      - name: Upload corpora
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: interop-corpora-js-${{ matrix.js-wols.slug }}
          path: ${{ runner.temp }}/corpora/
          if-no-files-found: ignore
