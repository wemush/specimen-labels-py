name: 'Publish Release'

on:
  push:
    tags:
      - '*'
  # Finish a release whose tag already published to PyPI (for example, the container
  # image or GitHub release step failed). Runs everything except the PyPI upload, and
  # attaches the files PyPI already has to the GitHub release.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to finish (already on PyPI), e.g. 1.5.0rc1'
        required: true
        type: string

env:
  EXIT_ON_PUBLISH_FAILURE: 1
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Run tests before publishing
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run ruff check
        run: uv run ruff check src tests

      - name: Run ruff format check
        run: uv run ruff format --check src tests

      - name: Run mypy
        run: uv run mypy src

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [test, lint]
    environment: pypi
    permissions:
      id-token: write
      contents: write
      discussions: write
      packages: write
    steps:
      - name: Checkout Source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@61cb8a9741eeb8a550a1b8544337180c0fc8476b # v7.2.0
        with:
          enable-cache: true
          python-version-file: .python-version

      - name: Verify Versions Match
        run: |
          TAG_VERSION=$(git describe HEAD --tags --abbrev=0)
          MODULE_VERSION=$(uv version)
          echo "Git Tag Version: $TAG_VERSION"
          echo "Python Module Version: $MODULE_VERSION"
          if [[ "wols $TAG_VERSION" != "$MODULE_VERSION" ]]; then exit 1; fi
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_ENV
          # PEP 440 pre-releases (1.5.0a1, 1.5.0b2, 1.5.0rc1, 1.5.0.dev1)
          if [[ "$TAG_VERSION" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "PRERELEASE=true" >> $GITHUB_ENV
          else
            echo "PRERELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build Package
        if: github.event_name == 'push'
        run: uv build

      - name: Publish to PyPi
        if: github.event_name == 'push'
        run: uv publish || exit $EXIT_ON_PUBLISH_FAILURE

      # Manual runs reuse the exact files already on PyPI instead of rebuilding them.
      - name: Download published files from PyPI
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          curl -fsSL "https://pypi.org/pypi/wols/${TAG_VERSION}/json" -o release.json
          jq -r '.urls[] | "\(.digests.sha256)  \(.filename) \(.url)"' release.json |
            while read -r sha name url; do
              curl -fsSL "$url" -o "dist/$name"
              echo "$sha  dist/$name" | sha256sum -c -
            done

      # Container Image Build and Push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags are PEP 440 (1.5.0rc1), which semver can't parse. Pre-releases only
          # get the full version tag; stable releases also get major.minor, major, latest.
          tags: |
            type=pep440,pattern={{version}},value=${{ env.TAG_VERSION }}
            type=pep440,pattern={{major}}.{{minor}},value=${{ env.TAG_VERSION }}
            type=pep440,pattern={{major}},value=${{ env.TAG_VERSION }}
          flavor: |
            latest=${{ env.PRERELEASE == 'false' }}

      - name: Build and push container image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ env.TAG_VERSION }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          discussion_category_name: announcements
          generate_release_notes: true
          files: |
            dist/wols-${{env.TAG_VERSION}}.tar.gz
            dist/wols-${{env.TAG_VERSION}}-py3-none-any.whl
